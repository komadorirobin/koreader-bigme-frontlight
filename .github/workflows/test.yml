name: Test Bigme frontlight patch
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit lua5.1 zip
      - run: make test LUA=lua5.1
      - run: make test LUA=luajit
      - run: make test-native
      - run: make package
